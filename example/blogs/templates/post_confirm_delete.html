<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Post</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .warning { background: #fff3cd; padding: 15px; border-radius: 5px; margin: 20px 0; }
        form { display: inline; }
        button { background: #dc3545; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        button:hover { background: #c82333; }
        a { color: #007bff; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Delete Post</h1>
        <div class="warning">
            <p><strong>Are you sure you want to delete this post?</strong></p>
            <p><strong>Title:</strong> {{ object.title }}</p>
            <p>This action cannot be undone.</p>
        </div>
        <form method="POST">
            {% csrf_token %}
            <button type="submit">Yes, Delete</button>
            <a href="{% url 'post_list' %}">Cancel</a>
        </form>
    </div>
</body>
</html>
