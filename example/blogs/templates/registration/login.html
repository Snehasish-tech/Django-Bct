<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', 'Georgia', serif;
            background: radial-gradient(circle at top left, #1a1a1a 0%, #0b0b0b 45%, #050505 100%);
            color: #f5f0e6;
            min-height: 100vh;
            padding: 40px 20px 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 520px;
            width: 100%;
        }

        .auth-container {
            background: linear-gradient(145deg, #101010 0%, #161616 100%);
            padding: 40px;
            border-radius: 14px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
        }

        .auth-container h1 {
            color: #f8f1d9;
            margin-bottom: 10px;
            font-size: 2em;
            text-align: center;
        }

        .auth-container p {
            text-align: center;
            color: #d2c7b5;
            margin-bottom: 28px;
            font-size: 0.95em;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #f0e6d2;
            font-weight: 600;
            font-size: 0.95em;
            letter-spacing: 0.2px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1em;
            color: #f5f0e6;
            background: rgba(10, 10, 10, 0.9);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: rgba(212, 175, 55, 0.7);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        button[type="submit"] {
            padding: 14px 20px;
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: #0b0b0b;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 18px rgba(212, 175, 55, 0.35);
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(212, 175, 55, 0.45);
        }

        .auth-links {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .auth-links p {
            color: #d2c7b5;
            margin: 10px 0;
        }

        .auth-links a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .auth-links a:hover {
            color: #f8f1d9;
            text-decoration: underline;
        }

        .error-message {
            background: rgba(227, 91, 91, 0.15);
            border: 1px solid rgba(227, 91, 91, 0.4);
            color: #f8d7d7;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <h1>🔐 Login</h1>
            <p>Sign in to your account</p>

            {% if form.non_field_errors %}
                <div class="error-message">
                    {% for error in form.non_field_errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" required>
                </div>

                <button type="submit">🔓 Login</button>
            </form>

            <div class="auth-links">
                <p>Don't have an account? <a href="{% url 'signup' %}">Sign up here</a></p>
                <p><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
            </div>
        </div>
    </div>
</body>
</html>
