<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6dd0ee 0%, #5c57f5 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .add-note-section {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #f5576c;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .note-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .note-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .note-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
        }

        .note-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .note-content {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
            word-break: break-word;
            max-height: 150px;
            overflow-y: auto;
        }

        .note-date {
            font-size: 12px;
            color: #999;
            margin-bottom: 15px;
        }

        .note-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
        }

        .btn-edit:hover {
            background: #2563eb;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 10px;
            color: #999;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .empty-state p {
            font-size: 18px;
        }

        .color-options {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: #333;
            transform: scale(1.15);
        }

        .color-yellow { background: #fbbf24; }
        .color-pink { background: #ec4899; }
        .color-blue { background: #3b82f6; }
        .color-green { background: #10b981; }
        .color-purple { background: #a855f7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📔 Notes App</h1>
            <p>Create, organize, and manage your notes easily</p>
        </div>

        <div class="add-note-section">
            <h2 style="margin-bottom: 20px; color: #333;">✏️ Create New Note</h2>
            
            <div class="form-group">
                <label for="noteTitle">Note Title</label>
                <input 
                    type="text" 
                    id="noteTitle" 
                    placeholder="Enter note title..."
                >
            </div>

            <div class="form-group">
                <label for="noteContent">Note Content</label>
                <textarea 
                    id="noteContent" 
                    placeholder="Write your note here..."
                ></textarea>
            </div>

            <div class="form-group">
                <label>Choose Color</label>
                <div class="color-options">
                    <div class="color-option color-yellow selected" data-color="yellow"></div>
                    <div class="color-option color-pink" data-color="pink"></div>
                    <div class="color-option color-blue" data-color="blue"></div>
                    <div class="color-option color-green" data-color="green"></div>
                    <div class="color-option color-purple" data-color="purple"></div>
                </div>
            </div>

            <button class="btn" onclick="addNote()">➕ Add Note</button>
        </div>

        <div id="notesContainer" class="notes-grid"></div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('notes')) || [];
        let selectedColor = 'yellow';

        // Color selection
        document.querySelectorAll('.color-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
                selectedColor = this.dataset.color;
            });
        });

        function addNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();

            if (!title || !content) {
                alert('Please fill in both title and content!');
                return;
            }

            const note = {
                id: Date.now(),
                title: title,
                content: content,
                color: selectedColor,
                date: new Date().toLocaleString()
            };

            notes.unshift(note);
            localStorage.setItem('notes', JSON.stringify(notes));

            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            selectedColor = 'yellow';
            document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
            document.querySelector('.color-yellow').classList.add('selected');

            renderNotes();
        }

        function deleteNote(id) {
            if (confirm('Delete this note?')) {
                notes = notes.filter(note => note.id !== id);
                localStorage.setItem('notes', JSON.stringify(notes));
                renderNotes();
            }
        }

        function renderNotes() {
            const container = document.getElementById('notesContainer');

            if (notes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">📝</div>
                        <p>No notes yet. Create one to get started!</p>
                    </div>
                `;
                return;
            }

            const colorBg = {
                yellow: '#fef3c7',
                pink: '#fce7f3',
                blue: '#dbeafe',
                green: '#dcfce7',
                purple: '#f3e8ff'
            };

            container.innerHTML = notes.map(note => `
                <div class="note-card" style="background: ${colorBg[note.color]};">
                    <div class="note-title">${escapeHtml(note.title)}</div>
                    <div class="note-content">${escapeHtml(note.content)}</div>
                    <div class="note-date">📅 ${note.date}</div>
                    <div class="note-actions">
                        <button class="btn-small btn-delete" onclick="deleteNote(${note.id})">
                            🗑️ Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initial render
        renderNotes();

        // Allow Enter key to add note (Ctrl+Enter)
        document.getElementById('noteContent').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                addNote();
            }
        });
    </script>
</body>
</html>
